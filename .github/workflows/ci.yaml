name: ci

# Triggers are trunk plus manual only. No pull_request trigger, no schedule, no feature branches:
# the Actions quota on this account was exhausted once by workflows that ran on everything.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the library and its dev tools
        # This is a library, not a product, so its unit tests are cheap and may run here: no
        # training stack, no solver binaries, seconds not minutes. The pyomo extra is deliberately
        # not installed; the solver-backed gate runs locally.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests
        # -rs so a silently skipped gate is visible in the log. A skipped test is not a pass.
        run: python -m pytest -rs

      - name: The SDD gate, every requirement names its verification
        run: python scripts/check_sdd.py

      - name: VERSION, the manifest and __version__ agree
        # copela's 0.04.001 release was cut with VERSION one step behind the manifest, and only the
        # publish workflow noticed, on the release tag. Checking on every trunk push fails the PR.
        run: |
          set -euo pipefail
          file_version="$(tr -d ' \r\n' < VERSION)"
          expected="$(python -c "print('.'.join(str(int(p)) for p in '${file_version}'.split('.')))")"
          manifest="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          package="$(python -c "import planteo;print(planteo.__version__)")"
          echo "VERSION=${file_version} expected=${expected} pyproject=${manifest} __version__=${package}"
          test "${manifest}" = "${expected}"
          test "${package}" = "${expected}"
